[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloombot"
version = "0.1.0"
description = "Classify exam questions by revised Bloom level, robustly across question sources, and rebalance question papers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "spacy>=3.7,<4",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pyyaml>=6",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "joblib>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Neural encoders (CPU or Apple-silicon MPS is enough; no CUDA GPU needed).
neural = ["torch>=2.2", "transformers>=4.44", "sentence-transformers>=3.0", "safetensors>=0.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bloombot = "bloombot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
src = ["src"]
