<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:10px;width:100%">
<sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)">{{ label }}</div></sc-if>
<div style="position:relative;padding-top:{{ padTop }}">
<div role="img" aria-label="{{ aria }}" style="display:flex;height:44px;border-radius:8px;overflow:hidden;background:var(--track)">
<sc-for list="{{ segs }}" as="s" hint-placeholder-count="3"><div title="{{ s.title }}" style="width:{{ s.w }};background:{{ s.bg }};color:{{ s.fg }};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;box-shadow:inset -1px 0 0 var(--surface);transition:width .8s cubic-bezier(.2,.7,.2,1)"><span style="display:{{ s.labelDisplay }};font-family:'JetBrains Mono',monospace">{{ s.n }} · {{ s.pct }}</span></div></sc-for>
</div>
<sc-for list="{{ markers }}" as="m" hint-placeholder-count="0"><div style="position:absolute;left:{{ m.left }};top:0;bottom:-8px;width:0;border-left:2px dashed var(--ink)">
<span style="position:absolute;top:0;left:0;transform:{{ m.tx }};white-space:nowrap;font-size:11px;font-weight:600;color:var(--ink);background:var(--surface);padding:1px 6px;border-radius:4px;border:1px solid var(--line)">{{ m.label }}</span>
</div></sc-for>
</div>
<div style="display:flex;gap:2px;min-height:30px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="3"><div style="width:{{ g.w }};display:{{ g.display }};flex-direction:column;gap:4px;min-width:0">
<div style="height:6px;border:2px solid {{ g.color }};border-top:none"></div>
<span style="font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ g.label }} {{ g.pct }}</span>
</div></sc-for>
</div>
<sc-if value="{{ showLegend }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-wrap:wrap;gap:6px 14px">
<sc-for list="{{ legend }}" as="l" hint-placeholder-count="6"><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)"><span style="width:16px;height:16px;border-radius:4px;background:{{ l.bg }};color:{{ l.fg }};font:600 9px/16px 'JetBrains Mono',monospace;text-align:center">{{ l.n }}</span>{{ l.name }} <span style="font-family:'JetBrains Mono',monospace;color:var(--ink)">{{ l.pct }}</span></span></sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const L = ['Remember','Understand','Apply','Analyze','Evaluate','Create'];
    const d = this.props.dist || [70,20,10,0,0,0];
    const segs = d.map((v, i) => ({ v, i })).filter(x => x.v > 0).map(({ v, i }) => ({
      n: i + 1, pct: v + '%', w: v + '%', bg: `var(--l${i + 1})`, fg: i >= 4 ? '#fff' : '#1b1f2a',
      labelDisplay: v >= 12 ? 'inline' : 'none', title: `${i + 1} ${L[i]} ${v}%`
    }));
    const markers = (this.props.markers || []).map(m => ({
      left: m.at + '%', label: m.label, tx: m.at > 70 ? 'translateX(calc(-100% - 6px))' : 'translateX(6px)'
    }));
    const lo = d[0] + d[1], mid = d[2], hi = d[3] + d[4] + d[5];
    const groups = [
      { label: lo >= 15 ? 'Lower order' : 'Lower', pct: lo + '%', w: lo + '%', display: lo > 0 ? 'flex' : 'none', color: 'var(--l2)' },
      { label: 'Apply', pct: mid + '%', w: mid + '%', display: mid > 0 ? 'flex' : 'none', color: 'var(--l3)' },
      { label: hi >= 15 ? 'Higher order' : 'Higher', pct: hi + '%', w: hi + '%', display: hi > 0 ? 'flex' : 'none', color: 'var(--l5)' }
    ];
    return {
      segs, markers, groups,
      padTop: markers.length ? '24px' : '0px',
      hasLabel: !!this.props.label, label: this.props.label,
      showLegend: this.props.legend !== false,
      legend: L.map((name, i) => ({ n: i + 1, name, pct: d[i] + '%', bg: `var(--l${i + 1})`, fg: i >= 4 ? '#fff' : '#1b1f2a' })),
      aria: 'Distribution by marks: ' + L.map((n, i) => `${n} ${d[i]}%`).join(', ')
    };
  }
}
</script>
</body>
</html>
